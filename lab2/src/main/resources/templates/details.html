<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Детали</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>Подробная информация</h1>
    <div class="card p-4">
        <p><strong>ID:</strong> <span th:text="${selectedPerson.id}"></span></p>
        <p><strong>Фамилия:</strong> <span th:text="${selectedPerson.lastName}"></span></p>
        <p><strong>Имя:</strong> <span th:text="${selectedPerson.firstName}"></span></p>
        <p><strong>Отчество:</strong> <span th:text="${selectedPerson.middleName}"></span></p>
        <p><strong>Пол:</strong> <span th:text="${selectedPerson.gender}"></span></p>
        <p><strong>Национальность:</strong> <span th:text="${selectedPerson.nationality}"></span></p>
        <p><strong>Рост (см):</strong> <span th:text="${selectedPerson.height}"></span></p>
        <p><strong>Вес (кг):</strong> <span th:text="${selectedPerson.weight}"></span></p>
        <p><strong>Дата рождения:</strong> <span th:text="${selectedPerson.birthDate}"></span></p>
        <p><strong>Телефон:</strong> <span th:text="${selectedPerson.phoneNumber}"></span></p>
    </div>
    <br>
    <a href="/persons" class="btn btn-secondary">Назад к списку</a>
</div>
</body>
</html>
