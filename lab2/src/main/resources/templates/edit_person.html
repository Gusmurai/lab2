<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Редактирование</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1 th:text="${person.id == null} ? 'Добавление человека' : 'Редактирование человека'"></h1>
    <form action="#" th:action="@{/persons/save}" th:object="${person}" method="post" class="mt-3">
        <!-- Скрытое поле ID нужно для обновления существующей записи -->
        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label>Фамилия:</label>
            <input type="text" class="form-control" th:field="*{lastName}" required/>
        </div>
        <div class="mb-3">
            <label>Имя:</label>
            <input type="text" class="form-control" th:field="*{firstName}" required/>
        </div>
        <div class="mb-3">
            <label>Отчество:</label>
            <input type="text" class="form-control" th:field="*{middleName}"/>
        </div>
        <div class="mb-3">
            <label>Пол:</label>
            <select class="form-control" th:field="*{gender}">
                <option value="Мужской">Мужской</option>
                <option value="Женский">Женский</option>
            </select>
        </div>
        <div class="mb-3">
            <label>Национальность:</label>
            <input type="text" class="form-control" th:field="*{nationality}"/>
        </div>
        <div class="mb-3">
            <label>Рост (см):</label>
            <input type="number" class="form-control" th:field="*{height}"/>
        </div>
        <div class="mb-3">
            <label>Вес (кг):</label>
            <input type="number" step="0.1" class="form-control" th:field="*{weight}"/>
        </div>
        <div class="mb-3">
            <label>Дата рождения:</label>
            <input type="date" class="form-control" th:field="*{birthDate}"/>
        </div>
        <div class="mb-3">
            <label>Телефон:</label>
            <input type="text" class="form-control" th:field="*{phoneNumber}"/>
        </div>

        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="/persons" class="btn btn-secondary">Отмена</a>
    </form>
</div>
</body>
</html>
