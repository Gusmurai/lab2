<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Список людей</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1>База данных: Люди</h1>
    <a href="/persons/add" class="btn btn-success mb-3">Добавить нового человека</a>

    <span th:if="${persons.iterator().hasNext() == false}" class="alert alert-warning d-block">Список пуст</span>

    <table th:if="${persons.iterator().hasNext()}" class="table table-hover table-bordered">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Фамилия</th>
            <th>Имя</th>
            <th>Дата рождения</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="person : ${persons}">
            <td th:text="${person.id}"></td>
            <td th:text="${person.lastName}"></td>
            <td th:text="${person.firstName}"></td>
            <td th:text="${person.birthDate}"></td>
            <td>
                <a class="btn btn-info btn-sm" th:href="@{'/persons/details/' + ${person.id}}">Детали</a>
                <a class="btn btn-warning btn-sm" th:href="@{'/persons/update/' + ${person.id}}">Изменить</a>
                <a class="btn btn-danger btn-sm" th:href="@{'/persons/delete/' + ${person.id}}">Удалить</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
